<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Світло Львівщина</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #090d16;
            --surface: #131b2e;
            --surface-card: #1b2640;
            --border: #2a3959;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.2);
            --red: #f43f5e;
            --red-glow: rgba(244, 63, 94, 0.2);
            --accent: #6366f1;
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
        }

        .app {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* HEADER */
        .header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .logo-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .logo-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .update-pill {
            background: var(--surface-card);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* CONTROLS */
        .controls {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .select-box {
            position: relative;
        }

        select {
            width: 100%;
            background: var(--surface-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            appearance: none;
        }

        .select-box::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 0.8rem;
        }

        .days-switch {
            display: flex;
            background: var(--surface-card);
            padding: 4px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .day-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-btn.active {
            background: var(--accent);
            color: #fff;
        }

        /* MAIN STATUS CARD */
        .main-status {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .main-status.is-on {
            border-color: var(--green);
            background: linear-gradient(180deg, var(--surface) 0%, var(--green-glow) 100%);
        }

        .main-status.is-off {
            border-color: var(--red);
            background: linear-gradient(180deg, var(--surface) 0%, var(--red-glow) 100%);
        }

        .status-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .is-on .status-circle {
            background: rgba(16, 185, 129, 0.15);
            color: var(--green);
        }

        .is-off .status-circle {
            background: rgba(244, 63, 94, 0.15);
            color: var(--red);
        }

        .status-header {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .is-on .status-header { color: var(--green); }
        .is-off .status-header { color: var(--red); }

        .status-sub {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .status-sub span {
            color: var(--text-main);
            font-weight: 700;
        }

        /* TIMELINE CARD */
        .timeline-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }

        .timeline-bar {
            height: 24px;
            background: var(--green);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .timeline-off {
            position: absolute;
            top: 0;
            bottom: 0;
            background: var(--red);
        }

        .timeline-ticks {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* INTERVALS LIST */
        .intervals-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .badge-off {
            background: var(--red-glow);
            border: 1px solid var(--red);
            color: var(--red);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-none {
            background: var(--green-glow);
            border: 1px solid var(--green);
            color: var(--green);
            padding: 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            width: 100%;
            text-align: center;
        }

        .no-data {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="app">
    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
            <div class="logo-text">
                <h1>Світло Львівщина</h1>
                <p>Статус черг в реальному часі</p>
            </div>
        </div>
        <div class="update-pill" id="updateTimeText">Щойно</div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="select-box">
            <select id="groupSelect">
                <option value="test">⚡ Група «ТЕСТ» (з відключеннями)</option>
                <option value="1.1">Група 1.1</option>
                <option value="1.2">Група 1.2</option>
                <option value="2.1">Група 2.1</option>
                <option value="2.2">Група 2.2</option>
                <option value="3.1">Група 3.1</option>
                <option value="3.2">Група 3.2</option>
                <option value="4.1">Група 4.1</option>
                <option value="4.2">Група 4.2</option>
                <option value="5.1">Група 5.1</option>
                <option value="5.2">Група 5.2</option>
                <option value="6.1">Група 6.1</option>
                <option value="6.2">Група 6.2</option>
            </select>
        </div>

        <div class="days-switch">
            <button class="day-btn active" id="btnToday" onclick="switchDay('today')">Сьогодні</button>
            <button class="day-btn" id="btnTomorrow" onclick="switchDay('tomorrow')">Завтра</button>
        </div>
    </div>

    <!-- STATUS CARD -->
    <div class="main-status" id="statusCard">
        <div class="status-circle" id="statusIcon">
            <i class="fa-solid fa-lightbulb"></i>
        </div>
        <div class="status-header" id="statusTitle">ПЕРЕВІРКА...</div>
        <div class="status-sub" id="statusTimer">Розрахунок...</div>
    </div>

    <!-- TIMELINE -->
    <div class="timeline-card">
        <div class="card-title">
            <span>Шкапа доби</span>
            <span id="groupLabel" style="color: var(--text-main);">Тест</span>
        </div>

        <div id="timelineContainer">
            <div class="timeline-bar" id="timelineBar"></div>
            <div class="timeline-ticks">
                <span>00:00</span>
                <span>06:00</span>
                <span>12:00</span>
                <span>18:00</span>
                <span>24:00</span>
            </div>
            <div class="intervals-list" id="intervalsList"></div>
        </div>

        <div id="noDataBox" class="no-data" style="display: none;">
            Графік на завтра ще не опубліковано Львівобленерго.
        </div>
    </div>
</div>

<script>
    const updateTimestamp = Date.now();

    // Графік на сьогодні (всі зі світлом, а "test" має багато відключень для перевірки)
    const scheduleToday = {
        "test": ["01:00-03:30", "08:00-11:00", "14:00-16:30", "20:00-23:00"],
        "1.1": [], "1.2": [], "2.1": [], "2.2": [],
        "3.1": [], "3.2": [], "4.1": [], "4.2": [],
        "5.1": [], "5.2": [], "6.1": [], "6.2": []
    };

    const scheduleTomorrow = null;

    let currentDay = 'today';
    let selectedGroup = localStorage.getItem('selectedGroup') || 'test';

    const groupSelect = document.getElementById('groupSelect');
    groupSelect.value = selectedGroup;

    groupSelect.addEventListener('change', (e) => {
        selectedGroup = e.target.value;
        localStorage.setItem('selectedGroup', selectedGroup);
        render();
    });

    function switchDay(day) {
        currentDay = day;
        document.getElementById('btnToday').classList.toggle('active', day === 'today');
        document.getElementById('btnTomorrow').classList.toggle('active', day === 'tomorrow');
        render();
    }

    function parseTime(str) {
        const p = str.split(':');
        return parseInt(p[0]) * 60 + parseInt(p[1]);
    }

    function formatTime(min) {
        const h = Math.floor(min / 60).toString().padStart(2, '0');
        const m = (min % 60).toString().padStart(2, '0');
        return `${h}:${m}`;
    }

    function getIntervals(group, day) {
        const sch = day === 'today' ? scheduleToday : scheduleTomorrow;
        if (!sch || !sch[group]) return [];
        return sch[group].map(s => {
            const p = s.split('-');
            return { start: parseTime(p[0]), end: parseTime(p[1]), raw: s };
        });
    }

    function renderStatus() {
        const card = document.getElementById('statusCard');
        const title = document.getElementById('statusTitle');
        const timer = document.getElementById('statusTimer');

        if (currentDay === 'tomorrow') {
            card.className = 'main-status';
            title.innerText = "ОЧІКУЄТЬСЯ";
            title.style.color = "var(--text-main)";
            timer.innerText = "Графік на завтра поки невідомий";
            return;
        }

        const now = new Date();
        const curMin = now.getHours() * 60 + now.getMinutes();
        const curSec = now.getSeconds();
        const intervals = getIntervals(selectedGroup, 'today');

        let isOff = false;
        let activeInv = null;
        let nextInv = null;

        for (let i = 0; i < intervals.length; i++) {
            const inv = intervals[i];
            if (curMin >= inv.start && curMin < inv.end) {
                isOff = true;
                activeInv = inv;
                break;
            }
            if (inv.start > curMin) {
                if (!nextInv || inv.start < nextInv.start) nextInv = inv;
            }
        }

        if (isOff) {
            card.className = 'main-status is-off';
            title.innerText = "НЕМАЄ СВІТЛА";
            const remSec = (activeInv.end - curMin - 1) * 60 + (60 - curSec);
            const m = Math.floor(remSec / 60);
            const s = remSec % 60;
            timer.innerHTML = `Увімкнуть через: <span>${m} хв ${s} с</span> (о ${formatTime(activeInv.end)})`;
        } else {
            card.className = 'main-status is-on';
            title.innerText = "СВІТЛО Є";
            if (nextInv) {
                const remSec = (nextInv.start - curMin - 1) * 60 + (60 - curSec);
                const m = Math.floor(remSec / 60);
                const s = remSec % 60;
                timer.innerHTML = `Вимкнуть через: <span>${m} хв ${s} с</span> (о ${formatTime(nextInv.start)})`;
            } else {
                timer.innerHTML = "До кінця дня відключень не планується";
            }
        }
    }

    function renderTimeline() {
        document.getElementById('groupLabel').innerText = groupSelect.options[groupSelect.selectedIndex].text;
        const container = document.getElementById('timelineContainer');
        const noData = document.getElementById('noDataBox');
        const bar = document.getElementById('timelineBar');
        const list = document.getElementById('intervalsList');

        if (currentDay === 'tomorrow' && !scheduleTomorrow) {
            container.style.display = 'none';
            noData.style.display = 'block';
            return;
        }

        container.style.display = 'block';
        noData.style.display = 'none';
        bar.innerHTML = '';
        list.innerHTML = '';

        const intervals = getIntervals(selectedGroup, currentDay);

        intervals.forEach(inv => {
            const left = (inv.start / 1440) * 100;
            const width = ((inv.end - inv.start) / 1440) * 100;

            const seg = document.createElement('div');
            seg.className = 'timeline-off';
            seg.style.left = `${left}%`;
            seg.style.width = `${width}%`;
            bar.appendChild(seg);

            const badge = document.createElement('div');
            badge.className = 'badge-off';
            badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${inv.raw}`;
            list.appendChild(badge);
        });

        if (intervals.length === 0) {
            list.innerHTML = `<div class="badge-none"><i class="fa-solid fa-circle-check"></i> Відключень немає (світло весь день)</div>`;
        }
    }

    function render() {
        renderStatus();
        renderTimeline();
    }

    render();
    setInterval(() => {
        renderStatus();
    }, 1000);
</script>
</body>
</html>
